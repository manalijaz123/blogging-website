name: PR Validation and Deployment

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'  # You can change this to your required Node.js version

      - name: Install dependencies
        run: npm install

      - name: Run Stylelint
        run: stylelint "styles/**/*.css"

  build:
    runs-on: ubuntu-latest
    needs: lint  # This ensures the build runs after linting is successful
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'

      - name: Install dependencies
        run: npm install

      - name: Build with Parcel
        run: npx parcel build src/index.html

  deploy:
    runs-on: ubuntu-latest
    needs: build  # Ensure deployment happens only after the build is successful
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        with:
          branch: gh-pages  # This can be 'main' or 'gh-pages' based on your repo's configuration
          folder: dist  # Adjust this path if your build folder is different
